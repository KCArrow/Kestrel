name: Release
on:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y zip
      - run: ./make-portable.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            kestrel.py
